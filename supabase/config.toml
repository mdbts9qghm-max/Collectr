# Supabase CLI: Einstellungen der Edge Functions.
# Der OAuth-Callback wird von WHOOP ohne Supabase-JWT aufgerufen → verify_jwt aus.
# Die anderen Functions prüfen das JWT zusätzlich selbst (requireUser).

[functions.whoop-oauth-callback]
verify_jwt = false

[functions.whoop-oauth-start]
verify_jwt = true

[functions.whoop-sync]
verify_jwt = true

[functions.whoop-disconnect]
verify_jwt = true

[functions.whoop-webhook]
verify_jwt = false

[functions.whoop-sync-all]
verify_jwt = false

[functions.push-send]
verify_jwt = false
